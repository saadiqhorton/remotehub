# SAA-348: on every PR, a clean Ubuntu runner follows the README's "Testing locally" steps.
name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # The existing desktop/agent/harness coverage below stays separate. This job
  # runs the complete Node suite without granting test code host privileges.
  node-tests:
    name: Node tests (coder-host, isolated)
    if: >-
      github.repository == 'saadiqhorton/remote-hub' &&
      github.actor == 'saadiqhorton' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'saadiqhorton' &&
        (github.event.pull_request.head.ref == 'feat/saa-301-docker-compose' ||
        github.event.pull_request.head.ref == 'feat/official-guacamole-client' || (github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/oauth-mcp-connected-host-tools'))) ||
       (github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         (github.ref == 'refs/heads/feat/saa-301-docker-compose' ||
         github.ref == 'refs/heads/feat/official-guacamole-client'))))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: coder-host-node-tests
      cancel-in-progress: false
    steps:
      - name: Verify runner
        env:
          ASSIGNED_RUNNER: ${{ runner.name }}
        run: test "$ASSIGNED_RUNNER" = coder-host
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node suite in disposable containers, with failure cleanup proof
        shell: bash
        run: |
          set -euo pipefail
          prefix="rh-node-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          work=$(mktemp -d "$RUNNER_TEMP/rh-node.XXXXXXXX")
          printf 'NODE_CI_PREFIX=%s\nNODE_CI_WORK=%s\n' "$prefix" "$work" >> "$GITHUB_ENV"
          cleanup() {
            for name in "$prefix-install" "$prefix-test" "$prefix-failure"; do
              if docker container inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
            done
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Record identities/start times only, never container environment or secrets.
          docker ps -q > "$work/baseline-ids"
          while read -r cid; do
            docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.State.Running}}' "$cid"
          done < "$work/baseline-ids" > "$work/baseline-state"
          docker pull node:22-bookworm
          image=$(docker image inspect node:22-bookworm --format '{{index .RepoDigests 0}}')
          printf 'Node image: %s\n' "$image"
          common=(--rm --init --user "$(id -u):$(id -g)" --read-only
            --cap-drop ALL --security-opt no-new-privileges:true
            --cpus 2 --memory 2g --pids-limit 512
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m
            --env HOME=/tmp/home --env NPM_CONFIG_CACHE=/tmp/npm-cache)
          # Deliberately fail a disposable fixture; its EXIT trap must remove it.
          set +e
          (
            trap 'docker rm -f "$prefix-failure" >/dev/null' EXIT
            docker run -d "${common[@]}" --network none --name "$prefix-failure" \
              "$image" node -e 'setInterval(() => {}, 1000)' >/dev/null || exit 1
            exit 9
          )
          failure_status=$?
          set -e
          test "$failure_status" -eq 9
          if docker container inspect "$prefix-failure" >/dev/null 2>&1; then
            echo 'Failure cleanup leaked its container'; exit 1
          fi
          echo 'Deliberate failure cleanup PASS'
          mkdir "$work/repo"
          # Only this disposable copy is writable. No home, socket, host PID/network,
          # devices, credentials, or repository secrets are passed to test code.
          docker run "${common[@]}" --name "$prefix-install" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$work/repo,dst=/work" --workdir /work \
            "$image" bash -euc 'cp -a /source/. /work/; mkdir -p "$HOME"; npm ci'
          docker run "${common[@]}" --name "$prefix-test" --network none \
            --mount "type=bind,src=$work/repo,dst=/work" --workdir /work \
            "$image" bash -euc '
              mkdir -p "$HOME"
              node --version
              npm run doctor
              npm run test:clean
              trap "npm run harness down ci" EXIT
              npm run harness up ci
              npm run harness status
              npm run harness down ci
              trap - EXIT
              git status --porcelain
              test -z "$(git status --porcelain)"
            '
          while read -r cid; do
            docker inspect --format '{{.Id}} {{.State.StartedAt}} {{.State.Running}}' "$cid"
          done < "$work/baseline-ids" > "$work/final-state"
          diff -u "$work/baseline-state" "$work/final-state"
          echo 'Existing running containers retained their identities and start times'
      - name: Remove only this run's containers and temporary workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${NODE_CI_PREFIX:-}"; then
            for suffix in install test failure; do
              name="$NODE_CI_PREFIX-$suffix"
              if docker container inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
              if docker container inspect "$name" >/dev/null 2>&1; then exit 1; fi
            done
          fi
          if test -n "${NODE_CI_WORK:-}"; then
            case "$NODE_CI_WORK" in "$RUNNER_TEMP"/rh-node.*) rm -rf -- "$NODE_CI_WORK";; *) exit 1;; esac
            test ! -e "$NODE_CI_WORK"
          fi
          echo 'Run containers and workspace cleanup PASS'
  test:
    if: >-
      github.repository == 'saadiqhorton/remote-hub' &&
      github.actor == 'saadiqhorton' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'saadiqhorton' &&
        (github.event.pull_request.head.ref == 'feat/saa-301-docker-compose' ||
        github.event.pull_request.head.ref == 'feat/official-guacamole-client' || (github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/oauth-mcp-connected-host-tools'))) ||
       (github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         (github.ref == 'refs/heads/feat/saa-301-docker-compose' ||
         github.ref == 'refs/heads/feat/official-guacamole-client'))))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    timeout-minutes: 60
    concurrency:
      group: coder-host-virtual-test
      cancel-in-progress: false
    defaults:
      run:
        shell: bash deploy/ci-vm.sh step {0}
    env:
      VM_RUST: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and create a disposable Ubuntu guest
        shell: bash
        env:
          ASSIGNED_RUNNER: ${{ runner.name }}
        run: |
          test "$ASSIGNED_RUNNER" = coder-host
          bash deploy/ci-vm.sh init
      - name: Install desktop test tools (README "Testing locally")
        run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc xterm guacd libguac-client-vnc0 libguac-client-rdp0 xrdp xorgxrdp build-essential
      - name: Guest artifact extraction safety regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 test/ci_vm_artifacts_test.py
      - run: npm ci
      - run: npm run doctor
      - name: Tests (fails if they change any file)
        run: npm run test:clean
      - name: Agent tests
        working-directory: agent
        shell: bash ../deploy/ci-vm.sh step {0}
        run: cargo test
      - name: Harness up / status / down
        run: |
          npm run harness up ci
          npm run harness status
          npm run harness down ci
      - name: Working tree must be unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Destroy the entire guest, including fixtures, even on failure
        if: always()
        shell: bash
        run: bash deploy/ci-vm.sh destroy
