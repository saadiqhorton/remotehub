name: agent

on:
  push:
    paths:
      - "agent/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "test/scripts/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "test/scripts/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: agent

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    if: >-
      github.repository == 'saadiqhorton/remote-hub' &&
      github.actor == 'saadiqhorton' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'saadiqhorton' &&
        (github.event.pull_request.head.ref == 'hortonsaadiq/saa-359-capture-desktop-sound-in-the-agent-on' ||
         github.event.pull_request.head.ref == 'feat/saa-301-docker-compose' ||
         github.event.pull_request.head.ref == 'feat/official-guacamole-client' || (github.event.pull_request.number == 35 && github.event.pull_request.head.ref == 'feat/oauth-mcp-connected-host-tools'))) ||
       (github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/hortonsaadiq/saa-359-capture-desktop-sound-in-the-agent-on' ||
         github.ref == 'refs/heads/feat/saa-301-docker-compose' ||
         github.ref == 'refs/heads/feat/official-guacamole-client')))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    concurrency:
      group: ${{ matrix.os == 'ubuntu-latest' && 'coder-host-virtual-agent' || format('agent-{0}-{1}', matrix.os, github.run_id) }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: agent
        shell: ${{ matrix.shell }}
    env:
      VM_RUST: "true"
    strategy:
      fail-fast: false
      # Native macOS and Windows jobs run for this desktop-audio branch so both platform backends compile.
      matrix: >-
        ${{
          (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/hortonsaadiq/saa-359-capture-desktop-sound-in-the-agent-on' || github.event.pull_request.head.ref == 'hortonsaadiq/saa-359-capture-desktop-sound-in-the-agent-on') &&
          fromJSON('{"include":[{"os":"ubuntu-latest","runner":["self-hosted","Linux","X64"],"shell":"bash ../deploy/ci-vm.sh step {0}"},{"os":"macos-latest","runner":"macos-latest","shell":"bash"},{"os":"windows-latest","runner":"windows-latest","shell":"bash"}]}') ||
          fromJSON('{"include":[{"os":"ubuntu-latest","runner":["self-hosted","Linux","X64"],"shell":"bash ../deploy/ci-vm.sh step {0}"}]}')
        }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify runner and create a disposable Ubuntu guest
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        env:
          ASSIGNED_RUNNER: ${{ runner.name }}
        run: |
          test "$ASSIGNED_RUNNER" = coder-host
          bash deploy/ci-vm.sh init
      - name: Install Clippy in the guest
        if: runner.os == 'Linux'
        run: rustup component add clippy
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test --all
      - name: Test WASAPI silent-packet handling
        if: runner.os == 'Windows'
        run: cargo test --manifest-path vendor/wasapi/Cargo.toml --lib
      - name: Build (release)
        run: cargo build --release
      - name: Destroy the entire guest, even on failure
        if: always() && runner.os == 'Linux'
        working-directory: .
        shell: bash
        run: bash deploy/ci-vm.sh destroy
